<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casa Nova – Lista de Compras</title>
<style>
:root{--bg:#f6f4f0;--card:#fff;--tx:#1f2328;--mut:#6b7280;--bd:#e4e0d8;--ac:#0f766e;--acx:#fff;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--chip:#efece6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--card:#1d2125;--tx:#e8eaed;--mut:#9aa3ad;--bd:#2b3138;--ac:#2dd4bf;--acx:#06201c;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--chip:#262b31;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171a;--card:#1d2125;--tx:#e8eaed;--mut:#9aa3ad;--bd:#2b3138;--ac:#2dd4bf;--acx:#06201c;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--chip:#262b31;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:16px 14px 96px}
h1{font-size:22px;margin:4px 0 2px}.sub{color:var(--mut);font-size:13px;margin:0 0 14px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px}
.s{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.s b{display:block;font-size:18px}.s span{font-size:12px;color:var(--mut)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;width:100%}
.bar input{flex:2 1 160px;width:auto}.bar select{flex:1 1 110px;width:auto}
.list{display:grid;gap:10px}
.it{display:flex;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px}
.ph{width:76px;height:76px;border-radius:10px;background:var(--chip);flex:none;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:26px}
.bd{flex:1;min-width:0}.nm{font-weight:600;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.tg{font-size:11px;background:var(--chip);border-radius:999px;padding:2px 8px;color:var(--mut)}
.tg.ok{color:var(--ok)}.tg.fa{color:var(--warn)}.tg.al{color:var(--bad)}
.pr{font-size:13px;color:var(--mut)}.pr b{color:var(--tx)}
.ac{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.b{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer;text-decoration:none;display:inline-block}
.b.p{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ac);color:var(--acx);border:0;border-radius:999px;padding:14px 20px;font-weight:600;box-shadow:0 4px 14px #0004;cursor:pointer}
dialog{border:1px solid var(--bd);border-radius:16px;background:var(--bg);color:var(--tx);width:min(560px,94vw);max-height:92vh;padding:16px}
dialog::backdrop{background:#0008}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g .f{grid-column:1/-1}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:2px}
.empty{text-align:center;color:var(--mut);padding:30px 0}
.foot{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
  <h1>🏠 Casa Nova</h1>
  <p class="sub">Tudo que falta e tudo que já foi comprado pro apê.</p>
  <div class="sum" id="sum"></div>
  <div class="bar">
    <input id="q" placeholder="Buscar item, loja, cômodo…">
    <select id="fs"><option value="">Todos</option><option value="falta">Faltam</option><option value="comprado">Comprados</option></select>
    <select id="fc"></select>
  </div>
  <div class="list" id="list"></div>
  <div class="foot">
    <button class="b" id="exp">⬇ Exportar backup</button>
    <button class="b" id="imp">⬆ Importar backup</button>
    <input type="file" id="impf" accept=".json" hidden>
  </div>
</div>
<button class="fab" id="add">+ Item</button>

<dialog id="dlg">
  <form id="frm" method="dialog">
    <h2 id="dt" style="margin:0 0 10px;font-size:18px">Novo item</h2>
    <div class="g">
      <div class="f"><label>Nome do item *</label><input id="n" required placeholder="Ex.: Airfryer 5L"></div>
      <div><label>Cômodo/categoria</label><select id="c"></select></div>
      <div><label>Prioridade</label><select id="p"><option>Alta</option><option selected>Média</option><option>Baixa</option></select></div>
      <div><label>Status</label><select id="s"><option value="falta">Falta comprar</option><option value="comprado">Comprado</option></select></div>
      <div><label>Preço estimado (R$)</label><input id="e" type="number" step="0.01" min="0" inputmode="decimal"></div>
      <div><label>Preço pago total (R$)</label><input id="v" type="number" step="0.01" min="0" inputmode="decimal"></div>
      <div><label>Nº de parcelas</label><input id="np" type="number" min="1" value="1" inputmode="numeric"></div>
      <div><label>Parcelas já pagas</label><input id="pp" type="number" min="0" value="0" inputmode="numeric"></div>
      <div><label>Onde comprou</label><select id="o"><option value="online">Online</option><option value="fisica">Loja física</option></select></div>
      <div><label>Loja</label><input id="l" placeholder="Amazon, Magalu…"></div>
      <div><label>Forma de pagamento</label><select id="fp"><option>Cartão de crédito</option><option>Pix</option><option>Boleto</option><option>Dinheiro</option><option>Débito</option></select></div>
      <div><label>Data da compra</label><input id="d" type="date"></div>
      <div class="f"><label>Link do produto</label><input id="u" type="url" placeholder="https://…"></div>
      <div class="f"><label>Foto</label><input id="ph" type="file" accept="image/*"></div>
      <div class="f"><label>Observações (cor, voltagem, garantia, nota fiscal…)</label><textarea id="ob" rows="2"></textarea></div>
    </div>
    <div class="foot">
      <button type="submit" class="b p" id="sv">Salvar</button>
      <button type="button" class="b" id="cl">Cancelar</button>
      <button type="button" class="b" id="dl" style="margin-left:auto;color:var(--bad)">Excluir</button>
    </div>
  </form>
</dialog>

<script>
(function(){
var KEY="casanova:v1",CATS=["Cozinha","Sala","Quarto","Banheiro","Lavanderia","Eletrodomésticos","Decoração","Outros"];
var items=[],editId=null,photo="";
var $=function(i){return document.getElementById(i)};
function load(){try{items=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){items=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){alert("Sem espaço no navegador. Exporte um backup e remova fotos pesadas.")}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function brl(n){return (Number(n)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function safeUrl(u){return /^https?:\/\//i.test(u||"")?u:""}
$("c").innerHTML=CATS.map(function(c){return "<option>"+c+"</option>"}).join("");
$("fc").innerHTML="<option value=''>Todas categorias</option>"+CATS.map(function(c){return "<option>"+c+"</option>"}).join("");

function render(){
  var q=$("q").value.toLowerCase(),fs=$("fs").value,fc=$("fc").value;
  var bought=items.filter(function(i){return i.s==="comprado"}),miss=items.filter(function(i){return i.s!=="comprado"});
  var spent=bought.reduce(function(a,i){return a+(+i.v||0)},0);
  var est=miss.reduce(function(a,i){return a+(+i.e||0)},0);
  var rest=0,month=0;
  bought.forEach(function(i){var n=Math.max(1,+i.np||1),p=Math.min(n,+i.pp||0),m=(+i.v||0)/n;if(p<n){rest+=m*(n-p);month+=m}});
  $("sum").innerHTML=[["Total gasto",brl(spent)],["Faltam comprar",miss.length+" itens"],["Estimado p/ faltantes",brl(est)],["Parcelas a pagar",brl(rest)],["Parcela mensal atual",brl(month)]].map(function(x){return "<div class='s'><span>"+x[0]+"</span><b>"+x[1]+"</b></div>"}).join("");
  var list=items.filter(function(i){
    if(fs&&i.s!==fs)return false;if(fc&&i.c!==fc)return false;
    return !q||[i.n,i.l,i.c,i.ob].join(" ").toLowerCase().indexOf(q)>-1;
  }).sort(function(a,b){if(a.s!==b.s)return a.s==="falta"?-1:1;var o={Alta:0,"Média":1,Baixa:2};return (o[a.p]||0)-(o[b.p]||0)});
  $("list").innerHTML=list.length?list.map(card).join(""):"<div class='empty'>Nenhum item ainda. Toque em “+ Item” pra começar 🛒</div>";
}
function card(i){
  var n=Math.max(1,+i.np||1),pg=Math.min(n,+i.pp||0),ok=i.s==="comprado";
  var img=i.ph?"<img class='ph' src='"+esc(i.ph)+"' alt=''>":"<div class='ph'>"+(ok?"✅":"🛒")+"</div>";
  var pr=ok?"<b>"+brl(i.v)+"</b>"+(n>1?" · "+n+"x de "+brl((+i.v||0)/n)+" ("+pg+"/"+n+" pagas)":" · à vista"):(i.e?"Estimado: <b>"+brl(i.e)+"</b>":"Sem preço estimado");
  var u=safeUrl(i.u);
  return "<div class='it'>"+img+"<div class='bd'><div class='nm'>"+esc(i.n)+"</div><div class='tags'>"+
    "<span class='tg "+(ok?"ok":"fa")+"'>"+(ok?"Comprado":"Falta")+"</span>"+
    "<span class='tg'>"+esc(i.c)+"</span>"+(ok?"":"<span class='tg "+(i.p==="Alta"?"al":"")+"'>Prioridade "+esc(i.p)+"</span>")+
    (ok?"<span class='tg'>"+(i.o==="online"?"🌐 Online":"🏬 Loja física")+(i.l?" · "+esc(i.l):"")+"</span>":"")+
    (ok&&i.fp?"<span class='tg'>"+esc(i.fp)+"</span>":"")+(ok&&i.d?"<span class='tg'>"+i.d.split("-").reverse().join("/")+"</span>":"")+
    "</div><div class='pr'>"+pr+"</div>"+(i.ob?"<div class='pr'>"+esc(i.ob)+"</div>":"")+
    "<div class='ac'>"+(ok&&n>1&&pg<n?"<button class='b' data-a='pay' data-id='"+i.id+"'>+1 parcela paga</button>":"")+
    (!ok?"<button class='b p' data-a='buy' data-id='"+i.id+"'>Marcar comprado</button>":"")+
    (u?"<a class='b' href='"+esc(u)+"' target='_blank' rel='noopener noreferrer'>🔗 Link</a>":"")+
    "<button class='b' data-a='edit' data-id='"+i.id+"'>Editar</button></div></div></div>";
}
function openDlg(it){
  editId=it?it.id:null;photo=it?it.ph||"":"";
  $("dt").textContent=it?"Editar item":"Novo item";$("dl").style.display=it?"":"none";
  var f={n:"",c:"Cozinha",p:"Média",s:"falta",e:"",v:"",np:1,pp:0,o:"online",l:"",fp:"Cartão de crédito",d:"",u:"",ob:""};
  var m={n:"n",c:"c",p:"p",s:"s",e:"e",v:"v",np:"np",pp:"pp",o:"o",l:"l",fp:"fp",d:"d",u:"u",ob:"ob"};
  Object.keys(m).forEach(function(k){$(m[k]).value=it&&it[k]!=null?it[k]:f[k]});
  $("ph").value="";$("dlg").showModal();
}
function readForm(){
  var o={id:editId||String(Date.now()),ph:photo};
  ["n","c","p","s","e","v","np","pp","o","l","fp","d","u","ob"].forEach(function(k){o[k]=$(k).value.trim()});
  if(o.s==="comprado"&&!o.d)o.d=new Date().toISOString().slice(0,10);
  return o;
}
$("ph").onchange=function(){
  var f=this.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){var im=new Image();im.onload=function(){
    var s=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    photo=c.toDataURL("image/jpeg",0.7)};im.src=r.result};
  r.readAsDataURL(f);
};
$("frm").onsubmit=function(e){
  e.preventDefault();var o=readForm();
  var ix=items.findIndex(function(i){return i.id===o.id});
  if(ix>-1)items[ix]=o;else items.push(o);
  save();render();$("dlg").close();
};
$("cl").onclick=function(){$("dlg").close()};
$("dl").onclick=function(){if(confirm("Excluir este item?")){items=items.filter(function(i){return i.id!==editId});save();render();$("dlg").close()}};
$("add").onclick=function(){openDlg(null)};
$("list").onclick=function(e){
  var b=e.target.closest("button[data-a]");if(!b)return;
  var it=items.find(function(i){return i.id===b.dataset.id});if(!it)return;
  if(b.dataset.a==="edit")openDlg(it);
  if(b.dataset.a==="pay"){it.pp=Math.min(+it.np,(+it.pp||0)+1);save();render()}
  if(b.dataset.a==="buy"){openDlg(it);$("s").value="comprado";$("v").value=it.e||""}
};
["q","fs","fc"].forEach(function(i){$(i).oninput=render});
$("exp").onclick=function(){
  var a=document.createElement("a");a.href="data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(items));
  a.download="casa-nova-backup.json";document.body.appendChild(a);a.click();a.remove();
};
$("imp").onclick=function(){$("impf").click()};
$("impf").onchange=function(){
  var f=this.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var d=JSON.parse(r.result);if(Array.isArray(d)&&confirm("Substituir a lista atual pelo backup?")){items=d;save();render()}}catch(e){alert("Arquivo inválido.")}};
  r.readAsText(f);
};
load();render();
})();
</script>
</body>
</html>
